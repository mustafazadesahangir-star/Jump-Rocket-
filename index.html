<!DOCTYPE html><html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jump Rocket</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(#87ceeb, #e0f6ff);
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      display: block;
      margin: auto;
      background: #9be7ff;
      border: 3px solid #333;
      border-radius: 12px;
      touch-action: none;
    }
    #ui {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #000;
      font-size: 18px;
      font-weight: bold;
      background: rgba(255,255,255,0.6);
      padding: 6px 14px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="ui">Skor: <span id="score">0</span></div>
  <canvas id="game" width="360" height="600"></canvas>  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    let score = 0;
    let gameOver = false;

    const player = {
      x: 180,
      y: 500,
      w: 30,
      h: 30,
      vy: -8,
      vx: 0
    };

    const gravity = 0.4;
    const platforms = [];

    function newPlatform(y) {
      const typeRand = Math.random();
      let type = 'normal';
      if (typeRand > 0.85) type = 'rocket';
      else if (typeRand > 0.7) type = 'bomb';

      platforms.push({
        x: Math.random() * 280,
        y,
        w: 80,
        h: 12,
        type
      });
    }

    for (let i = 0; i < 8; i++) newPlatform(600 - i * 80);

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') player.vx = -3;
      if (e.key === 'ArrowRight') player.vx = 3;
      if (gameOver && e.key === 'Enter') location.reload();
    });
    document.addEventListener('keyup', () => player.vx = 0);

    // Dokunmatik kontrol
    canvas.addEventListener('touchstart', e => {
      const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      if (touchX < canvas.width / 2) player.vx = -3;
      else player.vx = 3;
    });

    canvas.addEventListener('touchend', () => player.vx = 0);

    function update() {
      if (gameOver) return;

      player.vy += gravity;
      player.y += player.vy;
      player.x += player.vx;

      if (player.x < -player.w) player.x = canvas.width;
      if (player.x > canvas.width) player.x = -player.w;

      platforms.forEach(p => {
        if (
          player.vy > 0 &&
          player.x < p.x + p.w &&
          player.x + player.w > p.x &&
          player.y + player.h < p.y + p.h &&
          player.y + player.h > p.y
        ) {
          if (p.type === 'bomb') gameOver = true;
          if (p.type === 'rocket') player.vy = -16;
          else player.vy = -10;
        }
      });

      if (player.y < 250) {
        const diff = 250 - player.y;
        player.y = 250;
        platforms.forEach(p => p.y += diff);
        score += Math.floor(diff);
        scoreEl.textContent = score;
      }

      while (platforms.length && platforms[0].y > 600) {
        platforms.shift();
        newPlatform(-20);
      }

      if (player.y > canvas.height) gameOver = true;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff5050';
      ctx.fillRect(player.x, player.y, player.w, player.h);

      platforms.forEach(p => {
        if (p.type === 'normal') ctx.fillStyle = '#2ecc71';
        if (p.type === 'rocket') ctx.fillStyle = '#f1c40f';
        if (p.type === 'bomb') ctx.fillStyle = '#000';
        ctx.fillRect(p.x, p.y, p.w, p.h);
      });

      if (gameOver) {
        ctx.fillStyle = '#000';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 180, 280);
        ctx.font = '14px Arial';
        ctx.fillText('Enter ile yeniden başla', 180, 310);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script></body>
</html>
